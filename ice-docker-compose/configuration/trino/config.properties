coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

http-server.authentication.type=OAUTH2
web-ui.authentication.type=OAUTH2

http-server.authentication.oauth2.issuer=http://dex:5556/dex
http-server.authentication.oauth2.auth-url=http://dex:5556/dex/auth
http-server.authentication.oauth2.token-url=http://dex:5556/dex/token
http-server.authentication.oauth2.jwks-url=http://dex:5556/dex/keys
http-server.authentication.oauth2.userinfo-url=http://dex:5556/dex/userinfo
http-server.authentication.oauth2.client-id=trino-client
http-server.authentication.oauth2.client-secret=trino-secret
http-server.authentication.oauth2.scopes=openid,profile,email,groups
http-server.authentication.oauth2.groups-claim-field=groups