apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootstrap-admin
  namespace: ops
  labels:
    role: bootstrap
    purpose: install-and-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bootstrap-admin
  labels:
    role: bootstrap
    purpose: install-and-bootstrap
subjects:
  - kind: ServiceAccount
    name: bootstrap-admin
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
