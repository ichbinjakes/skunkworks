apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: polaris-db
  namespace: postgres
  labels:
    app.kubernetes.io/name: cnpg-polaris-db
    app.kubernetes.io/part-of: polaris
spec:
  instances: 1
  storage:
    size: 20Gi
    storageClass: standard
  postgresqlParams:
    max_connections: "200"
    shared_buffers: 512MB
    work_mem: 32MB
  bootstrap:
    initdb:
      database: polaris
      owner: polaris
      secret:
        name: polaris-db-credentials
  enableSuperuserAccess: false
